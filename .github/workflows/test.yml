name: pnpm build and test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  cache-and-install:
    runs-on: ubuntu-latest

    # peerDependencies allows React 18 and 19, so both have to be exercised.
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]

    name: react ${{ matrix.react }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use React ${{ matrix.react }}
        run: >-
          pnpm add -D
          react@^${{ matrix.react }}
          react-dom@^${{ matrix.react }}
          @types/react@^${{ matrix.react }}
          @types/react-dom@^${{ matrix.react }}

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test
